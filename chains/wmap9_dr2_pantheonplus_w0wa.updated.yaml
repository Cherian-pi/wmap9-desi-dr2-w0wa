prior:
  early_dark_energy_bound: 'lambda w, wa: 0.0 if w + wa < 0 else -np.inf'
params:
  ombh2:
    prior:
      min: 0.018
      max: 0.028
    ref:
      dist: norm
      loc: 0.02253
      scale: 0.0002
    proposal: 0.0002
    latex: \Omega_b h^2
    renames:
    - omegabh2
  omch2:
    prior:
      min: 0.08
      max: 0.16
    ref:
      dist: norm
      loc: 0.11515
      scale: 0.002
    proposal: 0.002
    latex: \Omega_c h^2
    renames:
    - omegach2
  H0:
    prior:
      min: 50.0
      max: 90.0
    ref:
      dist: norm
      loc: 68.9
      scale: 0.5
    proposal: 0.5
    latex: H_0
  ns:
    prior:
      min: 0.9
      max: 1.05
    ref:
      dist: norm
      loc: 0.972
      scale: 0.005
    proposal: 0.005
    latex: n_s
  logA:
    prior:
      min: 2.9
      max: 3.3
    ref:
      dist: norm
      loc: 3.096
      scale: 0.01
    proposal: 0.01
    latex: \ln(10^{10}A_s)
    drop: true
  tau:
    prior:
      min: 0.04
      max: 0.2
    ref:
      dist: norm
      loc: 0.088
      scale: 0.005
    proposal: 0.005
    latex: \tau
  w:
    prior:
      min: -3.0
      max: 1.0
    ref:
      dist: norm
      loc: -0.9
      scale: 0.05
    proposal: 0.05
    latex: w_0
  wa:
    prior:
      min: -3.0
      max: 2.0
    ref:
      dist: norm
      loc: -0.3
      scale: 0.1
    proposal: 0.1
    latex: w_a
  As:
    value: 'lambda logA: 1e-10 * np.exp(logA)'
    latex: A_s
    derived: true
  mnu:
    value: 0.06
  omk:
    value: 0.0
    renames:
    - omegak
  omegam:
    latex: \Omega_m
    derived: true
  rdrag:
    latex: r_d
    derived: true
  chi2__BAO:
    latex: \chi^2_\mathrm{BAO}
    derived: true
  chi2__SN:
    latex: \chi^2_\mathrm{SN}
    derived: true
